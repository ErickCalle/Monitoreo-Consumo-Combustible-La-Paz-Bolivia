; Herramienta aparte, NO es parte del firmware de produccion
; (esp32s3_obd2_speeddensity/). Se flashea solo para medir la Tabla 4.6
; del Capitulo 4 y despues se vuelve a flashear el firmware real.
[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
