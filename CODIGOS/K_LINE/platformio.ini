; ---------------------------------------------------------------------
; Mismo firmware base que CODIGOS/esp32s3_obd2_speeddensity, con la
; adquisicion OBD2 por K-Line (L9637D) en vez de CAN (SN65HVD230).
;
; ENGINE_DISPLACEMENT_L NO tiene valor por defecto a proposito (ver el
; #error en config.h): la compilacion de [env:kline] va a fallar hasta
; que descomentes la linea de abajo y pongas la cilindrada REAL de tu
; vehiculo (en litros) -- un numero inventado arruinaria el calculo de
; consumo sin que se note en el resultado, asi que se prefiere que el
; build directamente no compile en vez de compilar con un valor falso.
;
; Compilar y flashear:
;   pio run -e kline -t upload
; ---------------------------------------------------------------------
[platformio]
default_envs = kline

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; N16R8 = 16MB quad flash + 8MB octal PSRAM
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.5
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git

[env:kline]
build_flags =
    ${env.build_flags}
    -DVEHICLE_KLINE_CUSTOM
    ; -DENGINE_DISPLACEMENT_L=X.XXXf   ; <-- DESCOMENTAR y poner la cilindrada REAL (litros) antes de compilar
