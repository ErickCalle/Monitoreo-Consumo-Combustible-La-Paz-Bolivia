; ---------------------------------------------------------------------
; Un entorno por vehiculo -- el mismo firmware fuente, compilado con una
; bandera distinta que selecciona en tiempo de compilacion la cilindrada
; real y la tabla VE correspondiente (ver el bloque #if VEHICLE_* en
; include/config.h y src/fuel_calc.cpp). Evita tener que editar esos
; valores a mano cada vez que se cambia de vehiculo -- asi se encontro,
; y se corrigio, el error de cilindrada del Vanette (Tabla 4.4).
;
; Compilar y flashear:
;   pio run -e vanette -t upload
;   pio run -e changan -t upload
; ---------------------------------------------------------------------
[platformio]
default_envs = changan

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; N16R8 = 16MB quad flash + 8MB octal PSRAM
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.5
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git

[env:vanette]
build_flags =
    ${env.build_flags}
    -DVEHICLE_VANETTE

[env:changan]
build_flags =
    ${env.build_flags}
    -DVEHICLE_CHANGAN
